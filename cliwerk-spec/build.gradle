plugins {
    id 'java'
}

group = 'info.picocli'
description = 'cliwerk-spec - Build picocli CommandSpec models from a lightweight DSL or JSON, export any CommandSpec to JSON, and merge externally-defined command specs into a host CLI.'
version = "$projectVersion"
ext.moduleName = 'info.cliwerk.spec'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

dependencies {
    api rootProject
}

test {
    // Flix0600ExampleTest reads examples/*.cliwerk by a path relative to this module's directory
    // (Gradle's default test working directory) rather than as a classpath resource, so
    // Gradle's up-to-date check wouldn't otherwise notice when that file changes.
    inputs.dir('examples')
}

// Titles of the published javadoc name this project (docs/FORK.adoc).
javadoc.options.docTitle = "cliwerk-spec ${project.version} API"
javadoc.options.windowTitle = "cliwerk-spec ${project.version} API"

jar {
    manifest {
        attributes 'Specification-Title'   : 'cliwerk-spec',
                   'Specification-Vendor'  : 'Werner Stein (wstein)',
                   'Specification-Version' : archiveVersion.get(),
                   'Implementation-Title'  : 'cliwerk-spec',
                   'Implementation-Vendor' : 'Werner Stein (wstein)',
                   'Implementation-Version': archiveVersion.get()
    }
}

ext {
    PUBLISH_GROUP_ID = group
    PUBLISH_ARTIFACT_ID = project.name
    PUBLISH_VERSION = "$projectVersion"
}
apply from: "${rootProject.projectDir}/gradle/publish-mavencentral.gradle"
