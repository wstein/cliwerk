plugins {
    id 'java'
    // Pinned to the last com.gradleup.shadow release still buildable under Java 8 and Gradle
    // 8.x: 9.x requires Gradle 9 and Java 17 just to run the plugin (not merely to target Java
    // 17 bytecode), and even 8.3.10+ raised the minimum to Java 11. The CI matrix's lowest JDK
    // is 8, so neither can be assumed.
    id 'com.gradleup.shadow' version '8.3.9'
}

group = 'info.picocli'
description = 'cliwerk-spec-tool - the cliwerk-spec command line tool to preview, validate, and generate shell completion scripts and man pages from cliwerk-spec DSL/JSON spec files.'
version = "$projectVersion"
ext.moduleName = 'info.cliwerk.spec.tool'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

dependencies {
    api project(':cliwerk-spec')
    api project(':picocli-codegen')
}

jar {
    manifest {
        attributes 'Main-Class'            : 'cliwerk.spec.tool.SpecToolApp',
                   'Specification-Title'   : 'cliwerk-spec-tool',
                   'Specification-Vendor'  : 'Werner Stein (wstein)',
                   'Specification-Version' : archiveVersion.get(),
                   'Implementation-Title'  : 'cliwerk-spec-tool',
                   'Implementation-Vendor' : 'Werner Stein (wstein)',
                   'Implementation-Version': archiveVersion.get()
    }
}

// Bundles picocli + picocli-codegen + cliwerk-spec + this module's own classes into one
// self-contained, directly runnable jar: `java -jar cliwerk-spec-tool-<version>-all.jar ...`
// needs nothing else on the classpath. Not wired into "assemble" by this plugin version on
// its own -- done explicitly below -- so plain "build"/"assemble" produce it too.
shadowJar {
    archiveClassifier.set('all')
    manifest {
        attributes 'Main-Class': 'cliwerk.spec.tool.SpecToolApp'
    }
}
tasks.named('assemble') { dependsOn shadowJar }
