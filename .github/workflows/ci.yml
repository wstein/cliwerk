name: Build
on:
  # Pull requests run via pull_request only; push is limited to develop so that a commit on a PR
  # branch does not start a second, identical run.
  push:
    branches: [ develop ]
  pull_request:
    types: [ opened, synchronize, reopened, labeled ]
  schedule:
    - cron: '23 2 * * *' # nightly (02:23 UTC), full matrix
  workflow_dispatch:
permissions:
  checks: write
  pull-requests: write

concurrency:
  # cancel a stale in-progress run (e.g. superseded by a follow-up push or force-push)
  # for the same branch/PR, instead of letting it keep consuming this fork's limited
  # concurrent-job quota alongside the new run
  # (the event name keeps the nightly and manual runs from cancelling a push run on the same ref)
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Selects the matrix (see .github/scripts/ci_plan.py): the PR tier by default, the full tier on push to
  # develop, schedule, workflow_dispatch and PRs labeled ci-full. Docs-only changes get an empty plan
  # (run=false), so the build job is skipped; the required check is the always-running ci-gate job.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Plan build matrix
        id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 -I .github/scripts/ci_plan.py plan --event "$EVENT" --ref "$REF" --labels "$LABELS" --base "$BASE" --head "$HEAD"

  build-java-8-plus:
    needs: plan
    if: ${{ needs.plan.outputs.run == 'true' }}
    strategy:
      # one red leg (e.g. a Windows-only test failure) must not cancel the others and hide their results
      fail-fast: false
      max-parallel: 10 # this fork runs on a personal account's concurrency limits (20 jobs / 5 macOS); a larger matrix gets mass-cancelled otherwise
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    runs-on: ${{ matrix.os }}
    # This fork supports the LTS releases only: 8, 11, 17 and 21. Non-LTS and newer JDKs are
    # deliberately not built (JDK 25, for one, cannot even start this repo's Gradle 8.14
    # wrapper: "Unsupported class file major version 69"). macOS stays non-blocking because
    # the hosted runners are the flaky part, not the code.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Configure JDK ${{ matrix.java-version }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java-version }}
          cache: gradle

      - name: Show Gradle Version
        run: ./gradlew --version

      - name: ShowToolChains
        run: ./gradlew -q javaToolchains

      - name: Build
        id: build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --stop || true
          ./gradlew clean || true
          ./gradlew build --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Check core jar name and manifest
        shell: bash
        run: python3 -I .github/scripts/check-jar-manifest.py

      - name: Test CI scripts
        if: ${{ matrix.os == 'ubuntu-latest' }}
        shell: bash
        run: python3 -I -m unittest discover -s .github/scripts -p "test_*.py"

      - name: Report Gradle failure as annotations
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        shell: bash
        run: python3 -I .github/scripts/gradle-failure-annotations.py "$RUNNER_TEMP/gradle-build.log" build 80

      - name: Publish Test Results (Linux)
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        id: test-results-nix
        if: ${{ always() && matrix.os == 'ubuntu-latest' }}
        with:
          files: |
            build/test-results/test/**/*.xml
            picocli-*/build/test-results/test/**/*.xml
            cliwerk-*/build/test-results/test/**/*.xml

      - name: Publish Test Results (macOS)
        uses: EnricoMi/publish-unit-test-result-action/macos@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        id: test-results-mac
        if: ${{ always() && matrix.os == 'macos-latest' }}
        with:
          files: |
            build/test-results/test/**/*.xml
            picocli-*/build/test-results/test/**/*.xml
            cliwerk-*/build/test-results/test/**/*.xml

      - name: Publish Test Results (Windows)
        uses: EnricoMi/publish-unit-test-result-action/windows@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        id: test-results-win
        if: ${{ always() && matrix.os == 'windows-latest' }}
        with:
          files: |
            build/test-results/test/**/*.xml
            picocli-*/build/test-results/test/**/*.xml
            cliwerk-*/build/test-results/test/**/*.xml

      - name: Set badge color (Linux)
        shell: bash
        if: ${{ always() && matrix.os == 'ubuntu-latest' && steps.test-results-nix.outputs.json }}
        run: |
          case ${{ fromJSON( steps.test-results-nix.outputs.json ).conclusion }} in
            success)
              echo "BADGE_COLOR=31c653" >> $GITHUB_ENV
              ;;
            failure)
              echo "BADGE_COLOR=800000" >> $GITHUB_ENV
              ;;
            neutral)
              echo "BADGE_COLOR=696969" >> $GITHUB_ENV
              ;;
          esac

      - name: Set badge color (Win/Mac)
        shell: bash
        if: ${{ always() && (matrix.os == 'macos-latest' || matrix.os == 'windows-latest') && (steps.test-results-win.outputs.json || steps.test-results-mac.outputs.json) }}
        run: |
          case ${{ fromJSON( (steps.test-results-win.outputs.json || steps.test-results-mac.outputs.json) ).conclusion }} in
            success)
              echo "BADGE_COLOR=31c653" >> $GITHUB_ENV
              ;;
            failure)
              echo "BADGE_COLOR=800000" >> $GITHUB_ENV
              ;;
            neutral)
              echo "BADGE_COLOR=696969" >> $GITHUB_ENV
              ;;
          esac

      - name: Create badge (Linux)
        if: ${{ always() && matrix.os == 'ubuntu-latest' && steps.test-results-nix.outputs.json }}
        uses: emibcn/badge-action@f9150fde070fcca0c4e832437611b44838fcd325 # v2.0.4
        with:
          label: Tests
          status: '${{ fromJSON( steps.test-results-nix.outputs.json ).formatted.stats.tests }} tests, ${{ fromJSON( steps.test-results-nix.outputs.json ).formatted.stats.runs }} runs: ${{ fromJSON( steps.test-results-nix.outputs.json ).conclusion }}'
          color: ${{ env.BADGE_COLOR }}
          path: badge.svg

      - name: Create badge (Win/Mac)
        if: ${{ always() && (matrix.os == 'macos-latest' || matrix.os == 'windows-latest') && (steps.test-results-win.outputs.json || steps.test-results-mac.outputs.json) }}
        uses: emibcn/badge-action@f9150fde070fcca0c4e832437611b44838fcd325 # v2.0.4
        with:
          label: Tests
          status: '${{ fromJSON( (steps.test-results-win.outputs.json || steps.test-results-mac.outputs.json) ).formatted.stats.tests }} tests, ${{ fromJSON( (steps.test-results-win.outputs.json || steps.test-results-mac.outputs.json) ).formatted.stats.runs }} runs: ${{ fromJSON( (steps.test-results-win.outputs.json || steps.test-results-mac.outputs.json) ).conclusion }}'
          color: ${{ env.BADGE_COLOR }}
          path: badge.svg

      - name: Upload badge to Gist
        # Upload only for main branch
        if: >
          github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' ||
          github.event_name != 'workflow_run' && github.ref == 'refs/heads/main'
        uses: andymckay/append-gist-action@ab30bf28df67017c7ad696500b218558c7c04db3
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gistURL: https://gist.githubusercontent.com/remkop/36bc8a3b4395f2fbdb9bc271e97ba2dd
          file: badge.svg

  # Always runs; this is the check to require in branch protection. Succeeds iff the build job succeeded
  # or was skipped because the change is docs-only. macOS legs are continue-on-error and do not count.
  ci-gate:
    needs: [ plan, build-java-8-plus ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Evaluate build result
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RUN: ${{ needs.plan.outputs.run }}
          BUILD_RESULT: ${{ needs.build-java-8-plus.result }}
        run: python3 -I .github/scripts/ci_plan.py gate --plan-result "$PLAN_RESULT" --run "$RUN" --build-result "$BUILD_RESULT"
