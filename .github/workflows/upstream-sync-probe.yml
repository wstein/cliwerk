name: Upstream sync probe
# This fork is long-lived and diverges from remkop/picocli. This workflow trial-merges the upstream default branch
# into develop to detect merge conflicts early. It never commits or pushes anything: the trial merge is always aborted.
# Scheduled workflows only run from the default branch (develop), so this file must live there.
# Note: GitHub disables scheduled workflows after 60 days without repository activity; since the gate below makes many
# weekly runs empty, re-enable the workflow in the Actions tab if it has been switched off.
on:
  schedule:
    - cron: '23 5 * * 1' # weekly (Mondays, 05:23 UTC), but only if something changed, see job 'gate'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  # Scheduled runs only make sense if something changed since the previous scheduled run: the previous run did not
  # succeed (an unresolved conflict or failure stays red every week), develop moved (different head SHA than that run),
  # or upstream was pushed to after that run started (repository 'pushed_at', which errs on the safe side: any push to
  # any upstream branch counts; the commit date would be wrong because commits can be made long before they are pushed).
  # This needs no state of our own: it is derived from the Actions API (hence 'actions: read') and the public upstream
  # API. Manual runs always run.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read -r last_sha last_start last_conclusion < <(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/upstream-sync-probe.yml/runs?event=schedule&status=completed&per_page=1" \
            --jq '.workflow_runs[0] | "\(.head_sha // "none") \(.run_started_at // "1970-01-01T00:00:00Z") \(.conclusion // "none")"')
          last_sha=${last_sha:-none}; last_start=${last_start:-1970-01-01T00:00:00Z}; last_conclusion=${last_conclusion:-none}
          upstream_pushed=$(gh api repos/remkop/picocli --jq .pushed_at)
          echo "Previous scheduled run: develop=$last_sha started=$last_start conclusion=$last_conclusion"
          echo "Now: develop=$GITHUB_SHA, upstream pushed at $upstream_pushed"
          # ISO-8601 UTC timestamps compare correctly as strings
          if [ "$last_conclusion" != "success" ] || [ "$last_sha" != "$GITHUB_SHA" ] || [[ "$upstream_pushed" > "$last_start" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing changed since the previous scheduled run; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  probe:
    name: Trial merge of upstream
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false
      - name: Trial-merge upstream
        shell: bash
        env:
          UPSTREAM_URL: https://github.com/remkop/picocli.git
        run: |
          set -u
          git config user.name "upstream-sync-probe"
          git config user.email "noreply@github.com"
          git remote add upstream "$UPSTREAM_URL"
          branch=$(git ls-remote --symref upstream HEAD | sed -n 's|^ref: refs/heads/\(.*\)\tHEAD$|\1|p')
          [ -n "$branch" ] || { echo "Cannot determine the upstream default branch" >&2; exit 2; }
          git fetch --no-tags upstream "$branch:refs/remotes/upstream/$branch"
          behind=$(git rev-list --count "HEAD..upstream/$branch")
          conflicts=""
          status=clean
          if [ "$behind" -gt 0 ]; then
            if ! git merge --no-commit --no-ff "upstream/$branch" > "$RUNNER_TEMP/merge.log" 2>&1; then
              status=conflict
              conflicts=$(git diff --name-only --diff-filter=U)
              # a failed merge without unmerged files is an error, not a conflict
              if [ -z "$conflicts" ]; then status=error; fi
            fi
            git merge --abort 2>/dev/null || git reset --hard HEAD
          fi
          {
            echo "## Upstream sync probe"
            echo
            echo "- Upstream: \`remkop/picocli@$branch\` ($(git rev-parse --short "upstream/$branch"))"
            echo "- Fork: \`develop\` ($(git rev-parse --short HEAD))"
            echo "- Upstream commits not in develop: **$behind**"
            case "$status" in
              clean) echo "- Trial merge: **clean**" ;;
              conflict)
                echo "- Trial merge: **conflicts**"
                echo
                echo "Conflicting files:"
                echo
                echo "$conflicts" | sed 's/^/- `/; s/$/`/' ;;
              error)
                echo "- Trial merge: **failed without conflicts**"
                echo
                echo '```'; cat "$RUNNER_TEMP/merge.log"; echo '```' ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          [ "$status" = clean ]
