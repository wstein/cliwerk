name: Upstream sync probe
# This fork is long-lived and diverges from remkop/picocli. This workflow trial-merges the upstream default branch
# into develop to detect merge conflicts early. It never commits or pushes anything: the trial merge is always aborted.
# Scheduled workflows only run from the default branch (develop), so this file must live there.
on:
  schedule:
    - cron: '23 5 * * 1' # weekly (Mondays, 05:23 UTC), but only if something changed, see job 'gate'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  # Scheduled runs only make sense if something changed since the previous scheduled run: either upstream received
  # commits (its head commit is newer than that run's start) or develop moved (different head SHA than that run).
  # This needs no state of our own: it is derived from the Actions API (hence 'actions: read') and the public upstream
  # API. Comparing dates instead of recorded upstream SHAs avoids having to persist anything between runs.
  # Manual runs always run.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read -r last_sha last_start < <(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/upstream-sync-probe.yml/runs?event=schedule&status=completed&per_page=1" \
            --jq '.workflow_runs[0] | "\(.head_sha // "none") \(.run_started_at // "1970-01-01T00:00:00Z")"')
          last_sha=${last_sha:-none}; last_start=${last_start:-1970-01-01T00:00:00Z}
          branch=$(gh api repos/remkop/picocli --jq .default_branch)
          upstream_date=$(gh api "repos/remkop/picocli/commits/$branch" --jq .commit.committer.date)
          echo "Previous scheduled run: develop=$last_sha started=$last_start"
          echo "Now: develop=$GITHUB_SHA, upstream/$branch head committed $upstream_date"
          # ISO-8601 UTC timestamps compare correctly as strings
          if [ "$last_sha" != "$GITHUB_SHA" ] || [[ "$upstream_date" > "$last_start" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing changed since the previous scheduled run; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  probe:
    name: Trial merge of upstream
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false
      - name: Trial-merge upstream
        env:
          UPSTREAM_URL: https://github.com/remkop/picocli.git
        run: |
          set -u
          git config user.name "upstream-sync-probe"
          git config user.email "noreply@github.com"
          git remote add upstream "$UPSTREAM_URL"
          branch=$(git ls-remote --symref upstream HEAD | sed -n 's|^ref: refs/heads/\(.*\)\tHEAD$|\1|p')
          [ -n "$branch" ] || { echo "Cannot determine the upstream default branch" >&2; exit 2; }
          git fetch --no-tags upstream "$branch:refs/remotes/upstream/$branch"
          behind=$(git rev-list --count "HEAD..upstream/$branch")
          conflicts=""
          status=clean
          if [ "$behind" -gt 0 ]; then
            if ! git merge --no-commit --no-ff "upstream/$branch" > merge.log 2>&1; then
              status=conflict
              conflicts=$(git diff --name-only --diff-filter=U)
              # a failed merge without unmerged files is an error, not a conflict
              if [ -z "$conflicts" ]; then status=error; fi
            fi
            git merge --abort 2>/dev/null || git reset --hard HEAD
          fi
          {
            echo "## Upstream sync probe"
            echo
            echo "- Upstream: \`remkop/picocli@$branch\` ($(git rev-parse --short "upstream/$branch"))"
            echo "- Fork: \`develop\` ($(git rev-parse --short HEAD))"
            echo "- Upstream commits not in develop: **$behind**"
            case "$status" in
              clean) echo "- Trial merge: **clean**" ;;
              conflict)
                echo "- Trial merge: **conflicts**"
                echo
                echo "Conflicting files:"
                echo
                echo "$conflicts" | sed 's/^/- `/; s/$/`/' ;;
              error)
                echo "- Trial merge: **failed without conflicts**"
                echo
                echo '```'; cat merge.log; echo '```' ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          [ "$status" = clean ]
