name: API compatibility
# Checks that the public API of package picocli stays compatible with the last merged upstream
# picocli release (task apiCompat, gradle/api-compat.gradle; docs/FORK.adoc, "Upstream syncs").
# The findings are written to the job summary, to check run annotations and to the uploaded report.
# Report-only: findings never fail the job (failOnModification = false in gradle/api-compat.gradle);
# the job fails only when the task itself cannot run. If it does, the Gradle error is turned into
# check run annotations and the job summary (.github/scripts/gradle-failure-annotations.py).
# The task is opt-in (-PapiCompat) and not part of `check`.
on:
  push:
    branches: [ develop ]
    paths:
      - 'src/main/**'
      - 'picocli-spec/src/main/**'
      - 'build.gradle'
      - 'dependencies.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - '.github/scripts/api-compat-summary.py'
      - '.github/scripts/gradle-failure-annotations.py'
      - '.github/workflows/api-compat.yml'
  pull_request:
    branches: [ develop ]
    paths:
      - 'src/main/**'
      - 'picocli-spec/src/main/**'
      - 'build.gradle'
      - 'dependencies.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - '.github/scripts/api-compat-summary.py'
      - '.github/scripts/gradle-failure-annotations.py'
      - '.github/workflows/api-compat.yml'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api-compat:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@c6295a65d1254861815972266d5933fd6e532bdf
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6

      - name: Configure JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: 'zulu'
          java-version: 17
          cache: gradle

      - name: Check API compatibility with upstream picocli
        id: apicompat
        shell: bash
        run: |
          set -o pipefail
          ./gradlew apiCompat -PapiCompat --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/api-compat-gradle.log"

      - name: Report Gradle failure as annotations
        if: ${{ failure() && steps.apicompat.outcome == 'failure' }}
        run: python3 -I .github/scripts/gradle-failure-annotations.py "$RUNNER_TEMP/api-compat-gradle.log" apiCompat 80

      - name: Summarize findings
        if: ${{ always() && steps.apicompat.outcome == 'success' }}
        run: python3 -I .github/scripts/api-compat-summary.py build/reports/api-compat/api-compat.xml build/reports/api-compat/api-compat.txt build/reports/api-compat/summary.md gradle/api-compat-exceptions.txt && cat build/reports/api-compat/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # same pin as scorecards-analysis.yml
        with:
          name: api-compat-report
          path: |
            build/reports/api-compat/
            ${{ runner.temp }}/api-compat-gradle.log
          if-no-files-found: warn
