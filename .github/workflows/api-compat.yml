name: API compatibility
# Checks that the public API of package picocli stays compatible with the last merged upstream
# picocli release (task apiCompat, gradle/api-compat.gradle; docs/FORK.adoc, "Upstream syncs").
# The findings are written to the job summary, to check run annotations and to the uploaded report.
# Manual only (workflow_dispatch) while the task is being fixed: it is opt-in (-PapiCompat), not
# part of check, and does not block pushes or pull requests.
on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api-compat:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@c6295a65d1254861815972266d5933fd6e532bdf
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6

      - name: Configure JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: 'zulu'
          java-version: 17
          cache: gradle

      - name: Check API compatibility with upstream picocli
        continue-on-error: true
        run: ./gradlew apiCompat -PapiCompat --no-daemon

      - name: Summarize findings
        if: ${{ always() }}
        continue-on-error: true
        run: python3 -I .github/scripts/api-compat-summary.py build/reports/api-compat/api-compat.xml build/reports/api-compat/api-compat.txt build/reports/api-compat/summary.md && cat build/reports/api-compat/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # same pin as scorecards-analysis.yml
        with:
          name: api-compat-report
          path: build/reports/api-compat/
          if-no-files-found: warn
