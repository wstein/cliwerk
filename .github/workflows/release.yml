name: Release
on:
  push:
    # cliwerk versions have four numeric parts, <upstream x.y.z>.<fork revision> (docs/FORK.adoc, Versioning),
    # so upstream three-part tags such as v4.7.8 never trigger a cliwerk release.
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (four parts, e.g. 4.7.7.1, without a leading "v")'
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine version and tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Validate version
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          if ! printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$VERSION' is not <upstream x.y.z>.<fork revision> (four numeric parts, e.g. 4.7.7.1)"
            exit 1
          fi
          if ! grep -Fq "public static final String VERSION = \"${VERSION}\";" src/main/java/picocli/CommandLine.java; then
            echo "::error::CommandLine.VERSION does not match ${VERSION}; update it (and CommandLineTest.testVersion) before releasing"
            exit 1
          fi

      - name: Create and push tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.vars.outputs.tag }}"
          git push origin "${{ steps.vars.outputs.tag }}"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Configure JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: 17
          cache: gradle

      - name: Set release version
        run: |
          sed -i "s/projectVersion *= *\"[^\"]*\"/projectVersion = \"${{ steps.vars.outputs.version }}\"/" dependencies.gradle
          grep projectVersion dependencies.gradle

      - name: Build
        run: ./gradlew --stop; ./gradlew clean build --no-daemon

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.vars.outputs.tag }}" \
            build/libs/*.jar \
            --title "cliwerk ${{ steps.vars.outputs.version }}" \
            --generate-notes

      - name: Check out existing flat Maven repo (gh-pages)
        run: |
          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add gh-pages-site origin/gh-pages
          else
            git worktree add --detach gh-pages-site HEAD
            git -C gh-pages-site checkout --orphan gh-pages
            git -C gh-pages-site rm -rf . > /dev/null
          fi
          mkdir -p build/fork-maven-repo
          if [ -d gh-pages-site/maven ]; then
            cp -r gh-pages-site/maven/. build/fork-maven-repo/
          fi

      - name: Publish to flat Maven repo (jar + pom only, io.github.wstein:cliwerk)
        run: ./gradlew publishForkPublicationToForkRepoRepository --no-daemon

      - name: Generate javadoc
        run: ./gradlew :javadoc :picocli-spec:javadoc --no-daemon

      - name: Push updated site to GitHub Pages
        run: |
          rm -rf gh-pages-site/maven
          mkdir -p gh-pages-site/maven
          cp -r build/fork-maven-repo/. gh-pages-site/maven/

          rm -rf gh-pages-site/apidocs
          mkdir -p gh-pages-site/apidocs/picocli gh-pages-site/apidocs/picocli-spec
          cp -r build/docs/apidocs/. gh-pages-site/apidocs/picocli/
          cp -r picocli-spec/build/docs/apidocs/. gh-pages-site/apidocs/picocli-spec/

          # spec/schema is NOT wiped; only the latest schema is published
          # (spec/schema/command-spec.schema.json), its $id is that same URL.
          SCHEMA_SRC=picocli-spec/src/main/resources/picocli/spec/command-spec.schema.json
          mkdir -p gh-pages-site/spec/schema
          cp "$SCHEMA_SRC" gh-pages-site/spec/schema/command-spec.schema.json

          cp gh-pages/index.html gh-pages-site/index.html

          cd gh-pages-site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add maven apidocs spec index.html
          git commit -m "Publish io.github.wstein:cliwerk:${{ steps.vars.outputs.version }} (maven, javadoc, spec schema, site)" || echo "Nothing to commit"
          git push origin HEAD:gh-pages
