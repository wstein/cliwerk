name: Fish completion
# Loads the golden fish completion scripts (src/test/resources/*.fish) into real fish shells and checks what
# fish actually offers. The golden files are already verified against the generator by AutoCompleteTest,
# so this job needs no Java.
on:
  push:
    paths:
      - 'src/main/java/picocli/AutoComplete.java'
      - 'src/test/resources/*.fish'
      - 'src/test/fish/**'
      - '.github/workflows/fish-completion.yml'
  pull_request:
    paths:
      - 'src/main/java/picocli/AutoComplete.java'
      - 'src/test/resources/*.fish'
      - 'src/test/fish/**'
      - '.github/workflows/fish-completion.yml'
  schedule:
    - cron: '17 4 * * 1' # weekly (Mondays, 04:17 UTC), but only if there are new commits, see job 'gate'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  # Scheduled runs only make sense when something was pushed since the previous scheduled run.
  # All other triggers (push, pull request, manual) always run.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/fish-completion.yml/runs?event=schedule&status=completed&per_page=1" --jq '.workflow_runs[0].head_sha // ""')
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "No new commits since the last scheduled run ($last); skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Last scheduled run was on '$last', now '$GITHUB_SHA'."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  fish:
    name: fish ${{ matrix.name }}
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the fish versions shipped by common distributions, see docs/autocomplete.adoc
          - { name: '3.1 (Ubuntu 20.04)',     image: 'ubuntu:20.04', ppa: '' }
          - { name: '3.3 (Ubuntu 22.04)',     image: 'ubuntu:22.04', ppa: '' }
          - { name: '3.7 (Ubuntu 24.04)',     image: 'ubuntu:24.04', ppa: '' }
          - { name: '4.x (fish-shell PPA)',   image: 'ubuntu:24.04', ppa: 'ppa:fish-shell/release-4' }
    steps:
      - name: Install fish
        env:
          DEBIAN_FRONTEND: noninteractive
          PPA: ${{ matrix.ppa }}
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
          if [ -n "$PPA" ]; then
            apt-get install -y --no-install-recommends software-properties-common
            add-apt-repository -y "$PPA"
            apt-get update
          fi
          apt-get install -y --no-install-recommends fish
          fish --version

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Syntax check the golden files
        run: |
          for f in src/test/resources/*.fish; do
            echo "fish -n $f"
            fish -n "$f"
          done

      - name: Verify what fish offers
        run: fish src/test/fish/verify-completions.fish src/test/resources
