name: Dependabot auto-merge

# Dependabot PRs are opened from a branch in this same repository (not a fork), so the
# ordinary `pull_request` event already has write access via GITHUB_TOKEN -- no need for
# `pull_request_target` here, per GitHub's own recommended pattern for this exact case.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Only patch bumps auto-merge once CI passes. Minor bumps need a human look too: this
      # repo builds against JDK 8 and publishes a library whose own compatibility floor is
      # older still, and Gradle-plugin and build-tooling minors have historically dropped
      # support for exactly those old targets without calling it a breaking change.
      - name: Approve and enable rebase auto-merge for patch updates
        if: ${{ steps.metadata.outputs.update-type == 'version-update:semver-patch' }}
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --rebase "$PR_URL"
